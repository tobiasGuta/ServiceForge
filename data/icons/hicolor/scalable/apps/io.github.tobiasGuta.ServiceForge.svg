<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Drop shadow for the entire anvil -->
    <filter id="ground-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#05070a" flood-opacity="0.45"/>
    </filter>

    <!-- Drop shadow for the gear -->
    <filter id="gear-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#05070a" flood-opacity="0.4"/>
    </filter>

    <!-- Glow for the forge spark -->
    <filter id="spark-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Anvil Body Gradient (Dark industrial steel/slate) -->
    <linearGradient id="anvil-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e5666"/>
      <stop offset="35%" stop-color="#363d4a"/>
      <stop offset="100%" stop-color="#212630"/>
    </linearGradient>

    <!-- Anvil 3D base bevel -->
    <linearGradient id="anvil-base-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a303c"/>
      <stop offset="100%" stop-color="#14181f"/>
    </linearGradient>

    <!-- Anvil Top Face (Polished hardened steel plate) -->
    <linearGradient id="anvil-face" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a95a5"/>
      <stop offset="30%" stop-color="#a6b1c2"/>
      <stop offset="70%" stop-color="#8e99aa"/>
      <stop offset="100%" stop-color="#697484"/>
    </linearGradient>

    <!-- Gear Gradient (Adwaita Blue) -->
    <linearGradient id="gear-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#62a0ea"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>

    <!-- Gear 3D side -->
    <linearGradient id="gear-depth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c71d8"/>
      <stop offset="100%" stop-color="#104a94"/>
    </linearGradient>

    <!-- Forge Fire / Pulse Gradient -->
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeb82"/>
      <stop offset="40%" stop-color="#ffa348"/>
      <stop offset="100%" stop-color="#e01b24"/>
    </linearGradient>

    <!-- Heat glow on anvil surface -->
    <radialGradient id="heat-glow" cx="64" cy="56" r="32" fx="64" fy="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7800" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#ffa348" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff7800" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient floor contact shadow -->
  <ellipse cx="64" cy="116" rx="46" ry="7" fill="#040608" opacity="0.35"/>
  <ellipse cx="64" cy="115" rx="38" ry="5" fill="#040608" opacity="0.3"/>

  <!-- BACK LAYER: Systemd Service Gear (Rising from the anvil) -->
  <g filter="url(#gear-shadow)">
    <!-- Gear 3D depth layer -->
    <g transform="translate(0, 3)" fill="url(#gear-depth)">
      <path d="
        M 64 8
        L 68 8 L 69 13 L 74 15 L 78 11 L 81 14 L 79 19 L 83 23 L 88 22 L 89 26 L 85 29 L 87 34 L 92 36 L 91 40 L 86 41 L 86 46 L 90 50 L 87 53 L 83 50 L 78 54 L 78 58 L 74 58 L 72 53 L 67 53 L 64 57 L 61 53 L 56 53 L 54 58 L 50 58 L 50 54 L 45 50 L 41 53 L 38 50 L 42 46 L 42 41 L 37 40 L 36 36 L 41 34 L 43 29 L 39 26 L 40 22 L 45 23 L 49 19 L 47 14 L 50 11 L 54 15 L 59 13 L 60 8 Z
      "/>
      <circle cx="64" cy="33" r="13"/>
    </g>

    <!-- Gear Front Face -->
    <path fill="url(#gear-grad)" d="
      M 64 6
      L 68 6 L 69 11 L 74 13 L 78 9 L 81 12 L 79 17 L 83 21 L 88 20 L 89 24 L 85 27 L 87 32 L 92 34 L 91 38 L 86 39 L 86 44 L 90 48 L 87 51 L 83 48 L 78 52 L 78 56 L 74 56 L 72 51 L 67 51 L 64 55 L 61 51 L 56 51 L 54 56 L 50 56 L 50 52 L 45 48 L 41 51 L 38 48 L 42 44 L 42 39 L 37 38 L 36 34 L 41 32 L 43 27 L 39 24 L 40 20 L 45 21 L 49 17 L 47 12 L 50 9 L 54 13 L 59 11 L 60 6 Z
    "/>
    <!-- Gear rim highlight -->
    <circle cx="64" cy="31" r="18" fill="none" stroke="#99c1f1" stroke-width="1.2" opacity="0.6"/>

    <!-- Gear Inner Hole -->
    <circle cx="64" cy="31" r="12" fill="#1b2029"/>
    <circle cx="64" cy="31" r="12" fill="none" stroke="#104a94" stroke-width="1"/>
    <!-- Diagnostic Pulse Ring inside Gear -->
    <circle cx="64" cy="31" r="8" fill="none" stroke="#33d17a" stroke-width="1.8" stroke-dasharray="8 4"/>
    <circle cx="64" cy="31" r="3" fill="#33d17a"/>
  </g>

  <!-- FOREGROUND: The Forge Anvil (Solid, Tactile, Industrial) -->
  <g filter="url(#ground-shadow)">
    <!-- 1. Bottom Base & Feet (Layered 3D bevel) -->
    <!-- Base Bottom Edge (Dark shadow rim) -->
    <path d="
      M 28 111
      C 30 113, 38 115, 64 115
      C 90 115, 98 113, 100 111
      L 104 114
      C 101 116, 88 118, 64 118
      C 40 118, 27 116, 24 114 Z
    " fill="url(#anvil-base-bevel)"/>

    <!-- Base Pedestal Body -->
    <path d="
      M 28 107
      C 28 107, 34 112, 64 112
      C 94 112, 100 107, 100 107
      L 104 113
      C 98 116, 88 117, 64 117
      C 40 117, 30 116, 24 113 Z
    " fill="#1a1e27"/>

    <!-- Anvil Main Silhouette: Base flaring into waist and up to the head -->
    <path d="
      M 28 106
      L 32 98
      C 38 97, 44 93, 47 84
      C 48 80, 48 76, 46 72
      L 24 72
      C 16 71, 14 66, 14 62
      C 14 59, 18 56, 26 56
      L 104 56
      C 112 56, 115 60, 115 64
      C 115 69, 108 72, 102 72
      L 82 72
      C 80 76, 80 80, 81 84
      C 84 93, 90 97, 96 98
      L 100 106
      C 96 109, 86 111, 64 111
      C 42 111, 32 109, 28 106 Z
    " fill="url(#anvil-body)"/>

    <!-- Anvil Waist Shading (Curves & Volume) -->
    <!-- Waist core shadow -->
    <path d="
      M 48 74
      C 50 82, 48 89, 40 96
      C 48 97, 78 97, 88 96
      C 80 89, 78 82, 80 74 Z
    " fill="#181c24" opacity="0.45"/>

    <!-- Anvil Waist Left Highlight (Soft 3D contour) -->
    <path d="
      M 32 98
      C 38 97, 44 93, 47 84
      C 48 80, 48 76, 46 72
      L 48 72
      C 50 76, 50 81, 49 85
      C 46 94, 40 98, 34 99 Z
    " fill="#697484" opacity="0.3"/>

    <!-- Anvil Waist Center Ridge -->
    <path d="
      M 64 74
      L 64 100
    " stroke="#505b6d" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

    <!-- Heat glow radiating on the waist & neck -->
    <ellipse cx="64" cy="68" rx="26" ry="12" fill="url(#heat-glow)"/>

    <!-- 2. Hardened Top Face / Table of the Anvil (Perspective Plate) -->
    <!-- Bottom Bevel / Rim of the Top Face -->
    <path d="
      M 14 62
      C 14 66, 17 69, 24 70
      L 104 70
      C 111 69, 114 66, 114 62
      L 114 64
      C 114 68, 111 72, 102 72
      L 24 72
      C 16 72, 14 67, 14 64 Z
    " fill="#1e222a"/>

    <!-- Polished Top Face Surface -->
    <path d="
      M 26 56
      L 104 56
      C 111 56, 114 59, 114 62
      C 114 65, 110 68, 104 68
      L 26 68
      C 18 68, 14 65, 14 62
      C 14 59, 18 56, 26 56 Z
    " fill="url(#anvil-face)"/>

    <!-- Top Face Crisp Highlight Edge (Light from above) -->
    <path d="
      M 26 56
      L 104 56
      C 110 56, 113 58, 114 60
    " fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.55"/>

    <!-- Horn conical shine -->
    <path d="
      M 14 62
      C 16 60, 20 58, 28 57
    " fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <!-- Pritchel & Hardy Holes on the Heel (Precision tooling details) -->
    <!-- Square Hardy Hole -->
    <rect x="94" y="59.5" width="4.5" height="4.5" rx="0.8" fill="#1a1e27"/>
    <rect x="94" y="59.5" width="4.5" height="4.5" rx="0.8" fill="none" stroke="#363d4a" stroke-width="0.6"/>
    <!-- Round Pritchel Hole -->
    <circle cx="104.5" cy="61.7" r="2" fill="#1a1e27"/>
    <circle cx="104.5" cy="61.7" r="2" fill="none" stroke="#363d4a" stroke-width="0.6"/>

    <!-- 3. The Forge Spark / Strike (Active system energy at the strike point) -->
    <g filter="url(#spark-glow)">
      <!-- Outer spark diamond -->
      <path d="
        M 64 42
        L 67.5 49.5
        L 75 53
        L 67.5 56.5
        L 64 64
        L 60.5 56.5
        L 53 53
        L 60.5 49.5 Z
      " fill="url(#spark-grad)"/>

      <!-- Inner high-energy white core -->
      <path d="
        M 64 47
        L 65.8 51.2
        L 70 53
        L 65.8 54.8
        L 64 59
        L 62.2 54.8
        L 58 53
        L 62.2 51.2 Z
      " fill="#ffffff" opacity="0.95"/>

      <!-- Dynamic electric sparks flying from the strike -->
      <circle cx="50" cy="45" r="1.5" fill="#f9f06b"/>
      <circle cx="78" cy="46" r="1.5" fill="#ffa348"/>
      <circle cx="73" cy="62" r="1.2" fill="#ff7800"/>
      <circle cx="54" cy="61" r="1.2" fill="#f8e45c"/>
      <line x1="64" y1="36" x2="64" y2="39" stroke="#ffeb82" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="46" y1="51" x2="49" y2="52" stroke="#ffeb82" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="79" y1="54" x2="82" y2="55" stroke="#ffa348" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
