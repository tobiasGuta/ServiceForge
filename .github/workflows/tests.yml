name: Tests

on:
  push:
  pull_request:

jobs:
  normalize:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source files
        run: python -m compileall -q src
      - name: Pure Python unit tests
        run: python -m unittest discover -s tests -v
      # GTK4/Libadwaita and systemd integration still need a Fedora runner.

  fedora-import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fedora: ["44", "45"]
    container:
      image: fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native Fedora dependencies
        run: dnf install -y python3 python3-gobject gtk4 libadwaita python3-systemd xorg-x11-server-Xvfb
      - name: Import GTK application and journal backend
        run: |
          PYTHONPATH=src python3 -c "from serviceforge.ui.main_window import MainWindow; from serviceforge.ui.overview_view import OverviewView; from serviceforge.ui.journal_view import JournalView; from serviceforge.backend.journal_reader import read_journal; print('Native imports OK')"
      - name: Construct GTK widgets in a virtual display
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/tmp/serviceforge-xvfb.log 2>&1 &
          sleep 2
          DISPLAY=:99 GDK_BACKEND=x11 GSK_RENDERER=cairo PYTHONPATH=src python3 tests/gui_smoke.py
      - name: Run pure-Python tests
        run: python3 -m unittest discover -s tests -v
      # Headless GTK construction is not a substitute for Fedora desktop integration tests.
