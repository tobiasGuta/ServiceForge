name: Tests

on:
  push:
  pull_request:

jobs:
  normalize:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source files
        run: python -m compileall -q src
      - name: Pure Python unit tests
        run: python -m unittest discover -s tests -v
      # GTK4/Libadwaita and systemd integration still need a Fedora runner.

  fedora-import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fedora: ["44", "45"]
    container:
      image: fedora:${{ matrix.fedora }}
    steps:
      - name: Install native Fedora dependencies
        run: dnf install -y git rpm-build python3-devel pyproject-rpm-macros python3-setuptools python3-wheel desktop-file-utils python3-gobject gtk4 libadwaita python3-systemd systemd-journal-remote xorg-x11-server-Xvfb
      - uses: actions/checkout@v4
      - name: Import GTK application and journal backend
        run: |
          PYTHONPATH=src python3 -c "from serviceforge.ui.main_window import MainWindow; from serviceforge.ui.overview_view import OverviewView; from serviceforge.ui.journal_view import JournalView; from serviceforge.backend.journal_reader import read_journal; print('Native imports OK')"
      - name: Construct GTK widgets in a virtual display
        run: |
          Xvfb :99 -screen 0 1280x800x24 >/tmp/serviceforge-xvfb.log 2>&1 &
          sleep 2
          DISPLAY=:99 GDK_BACKEND=x11 GSK_RENDERER=cairo PYTHONPATH=src python3 tests/gui_smoke.py
      - name: Check mocked service-job result tracking
        run: PYTHONPATH=src python3 tests/actions_smoke.py
      - name: Check installed-but-unloaded service lookup
        run: PYTHONPATH=src python3 tests/unit_lookup_smoke.py
      - name: Check mocked live manager signals, debounce, and fallback
        run: PYTHONPATH=src python3 tests/monitor_smoke.py
      - name: Check mocked persistent unit-file actions and Polkit denial
        run: PYTHONPATH=src python3 tests/unit_file_actions_smoke.py
      - name: Check native journal filtering across boots
        run: PYTHONPATH=src python3 tests/journal_smoke.py
      - name: Run pure-Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and install the preview RPM
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          rpmdir=$(mktemp -d)
          mkdir -p "$rpmdir/SOURCES"
          git -c safe.directory="$PWD" archive --format=tar.gz --prefix="ServiceForge-$version/" -o "$rpmdir/SOURCES/ServiceForge-$version.tar.gz" HEAD
          rpmbuild -ba --define "_topdir $rpmdir" packaging/serviceforge.spec
          dnf install -y "$rpmdir"/RPMS/noarch/*.rpm
          python3 -c 'from serviceforge.app import ServiceForgeApplication'
          desktop-file-validate /usr/share/applications/io.github.tobiasGuta.ServiceForge.desktop
          mkdir -p dist
          cp "$rpmdir"/RPMS/noarch/*.rpm "$rpmdir"/SRPMS/*.src.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: serviceforge-fedora-${{ matrix.fedora }}
          path: dist/*.rpm
      # Headless checks are not a substitute for Fedora desktop integration tests.
